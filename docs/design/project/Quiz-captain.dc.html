<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Quiz voor de captain</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&amp;family=Shrikhand&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#2B1810}
a{color:#F5AE1B}a:hover{color:#FCEBD0}
button{font:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:3px solid #FCEBD0;outline-offset:3px}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes denkt{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #2B1810; color: #FCEBD0; font-family: Rubik, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <svg aria-hidden="true" width="390" height="150" viewBox="0 0 390 150" style="position: absolute; top: 0; left: 0; pointer-events: none">
    <path d="M-10 10 H318 A62 62 0 0 1 380 72 V140" fill="none" stroke="#F5AE1B" stroke-width="7" stroke-linecap="round"/>
    <path d="M-10 20 H318 A52 52 0 0 1 370 72 V140" fill="none" stroke="#F06A1F" stroke-width="7" stroke-linecap="round"/>
    <path d="M-10 30 H318 A42 42 0 0 1 360 72 V140" fill="none" stroke="#B4441A" stroke-width="7" stroke-linecap="round"/>
  </svg>

  <div style="position: relative; padding: 50px 22px 24px 22px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 6px; padding-right: 40px">
      <span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 6px; border-radius: 999px; background: #3B2417; font-size: 14px; font-weight: 700"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 999px; background: #F5AE1B"></span>Captain van Team Mosterd</span>
      <span style="font-size: 14px; color: #E9C9A0">Ronde 2 van 5, vraag 4 van 10</span>
      <h1 style="margin: 0; font-family: Shrikhand, 'Arial Black', serif; font-weight: 400; font-size: 26px; line-height: 1.1; text-shadow: 3px 3px 0 #F06A1F">Familie in cijfers</h1>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 999px; background: #F5AE1B; color: #2B1810; font-size: 15px; font-weight: 700">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B1810" stroke-width="2.2" style="flex: none"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M12 8l1.2 2.5 2.7.4-2 1.9.5 2.7-2.4-1.3-2.4 1.3.5-2.7-2-1.9 2.7-.4z" fill="#2B1810" stroke="none"/></svg>
      Joker ingezet: deze ronde telt dubbel
    </div>

    <section style="background: #FCEBD0; color: #2B1810; border-radius: 22px; padding: 16px 18px; box-shadow: 0 6px 0 #140B06; display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0; font-size: 23px; line-height: 1.2; font-weight: 800">Hoeveel van ons hebben ooit iets gebroken?</h2>
      <p style="margin: 0; font-size: 14px; line-height: 1.4">{{hulptekst}}</p>
    </section>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{tegels}}" as="t" hint-placeholder-count="4">
        <button type="button" onClick="{{t.kies}}" aria-label="{{t.label}}" aria-pressed="{{t.gedrukt}}" style="position: relative; height: 108px; border-radius: 22px; border: 4px solid {{t.rand}}; background: {{t.kleur}}; color: #2B1810; opacity: {{t.op}}; transform: scale({{t.schaal}}); transition: transform 0.15s ease, opacity 0.3s ease; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 12px 14px; box-shadow: 0 5px 0 #140B06; text-align: left">
          <sc-if value="{{t.isZon}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.6" fill="#2B1810"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="#2B1810" stroke-width="2.4" stroke-linecap="round"/></svg></sc-if>
          <sc-if value="{{t.isBloem}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24"><g fill="#2B1810"><circle cx="12" cy="6.6" r="3.6"/><circle cx="16.7" cy="9.3" r="3.6"/><circle cx="16.7" cy="14.7" r="3.6"/><circle cx="12" cy="17.4" r="3.6"/><circle cx="7.3" cy="14.7" r="3.6"/><circle cx="7.3" cy="9.3" r="3.6"/></g><circle cx="12" cy="12" r="2.8" fill="#F5AE1B"/></svg></sc-if>
          <sc-if value="{{t.isSter}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="#2B1810"/></svg></sc-if>
          <sc-if value="{{t.isMaan}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="#2B1810"/></svg></sc-if>
          <span style="font-family: Shrikhand, 'Arial Black', serif; font-size: 36px; line-height: 1">{{t.waarde}}</span>
          <sc-if value="{{t.isGekozen}}" hint-placeholder-val="{{ false }}">
            <span style="position: absolute; top: 10px; right: 10px; background: #2B1810; color: #FCEBD0; font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 999px; animation: pop 0.25s ease-out">Jouw keuze</span>
          </sc-if>
          <sc-if value="{{t.isGoed}}" hint-placeholder-val="{{ false }}">
            <span style="position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 999px; background: #FCEBD0; display: flex; align-items: center; justify-content: center; animation: pop 0.35s ease-out"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B1810" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
          </sc-if>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 700; color: #E9C9A0">{{aantalKlaar}} van 4 teams hebben geantwoord</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{teams}}" as="tm" hint-placeholder-count="4">
          <span style="display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; background: #3B2417; font-size: 14px; font-weight: 700">
            <span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 999px; background: {{tm.kleur}}; flex: none"></span>
            <span style="flex: 1">{{tm.naam}}</span>
            <sc-if value="{{tm.klaar}}" hint-placeholder-val="{{ true }}"><svg aria-label="heeft geantwoord" role="img" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A7B43A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></sc-if>
            <sc-if value="{{tm.denkt}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; color: #E9C9A0; animation: denkt 1.2s ease-in-out infinite">denkt na</span></sc-if>
          </span>
        </sc-for>
      </div>
    </div>

    <sc-if value="{{onthuld}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 18px; background: {{uitslagBg}}; color: {{uitslagFg}}; font-size: 16px; font-weight: 700; line-height: 1.35; animation: pop 0.3s ease-out">
        <span style="flex: 1">{{uitslag}}</span>
        <button type="button" onClick="{{opnieuw}}" style="flex: none; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid {{uitslagFg}}; background: transparent; color: {{uitslagFg}}; font-size: 14px; font-weight: 700">Opnieuw</button>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.startDemo();
  }
  componentWillUnmount() {
    clearTimeout(this.t1);
    clearTimeout(this.t2);
  }
  startDemo() {
    clearTimeout(this.t1);
    clearTimeout(this.t2);
    this.t2 = null;
    this.t1 = setTimeout(() => {
      this.setState({ petrol: true });
      this.misschienOnthullen(true, null);
    }, 3500);
  }
  misschienOnthullen(petrolNu, keuzeNu) {
    const S = this.state || {};
    const petrol = petrolNu === true ? true : !!S.petrol;
    const keuze = keuzeNu || S.keuze;
    if (petrol && keuze && !this.t2) {
      this.t2 = setTimeout(() => this.setState({ onthuld: true }), 2600);
    }
  }
  renderVals() {
    const S = this.state || {};
    const keuze = S.keuze || null;
    const onthuld = !!S.onthuld;
    const petrol = !!S.petrol;
    const goed = 'c';
    const basis = [
      { k: 'a', naam: 'Zon', waarde: '9', kleur: '#F06A1F' },
      { k: 'b', naam: 'Bloem', waarde: '14', kleur: '#F5AE1B' },
      { k: 'c', naam: 'Ster', waarde: '17', kleur: '#A7B43A' },
      { k: 'd', naam: 'Maan', waarde: '23', kleur: '#4FA3A5' }
    ];
    const tegels = basis.map((t) => ({
      waarde: t.waarde, kleur: t.kleur,
      label: t.naam + ': ' + t.waarde,
      gedrukt: keuze === t.k ? 'true' : 'false',
      isZon: t.k === 'a', isBloem: t.k === 'b', isSter: t.k === 'c', isMaan: t.k === 'd',
      isGekozen: !onthuld && keuze === t.k,
      isGoed: onthuld && t.k === goed,
      rand: (onthuld && t.k === goed) || (!onthuld && keuze === t.k) ? '#FCEBD0' : 'transparent',
      op: onthuld && t.k !== goed ? '0.35' : '1',
      schaal: !onthuld && keuze === t.k ? '1.03' : '1',
      kies: () => {
        if (onthuld) return;
        this.setState({ keuze: t.k });
        this.misschienOnthullen(null, t.k);
      }
    }));
    const teams = [
      { naam: 'Oranje', kleur: '#F06A1F', klaar: true },
      { naam: 'Mosterd, jij', kleur: '#F5AE1B', klaar: !!keuze },
      { naam: 'Avocado', kleur: '#6F7F1F', klaar: true },
      { naam: 'Petrol', kleur: '#17565E', klaar: petrol }
    ].map((t) => ({ naam: t.naam, kleur: t.kleur, klaar: t.klaar, denkt: !t.klaar }));
    const aantal = teams.filter((t) => t.klaar).length;
    const juist = keuze === goed;
    let hulp = 'Overleg met je team en tik op een antwoord.';
    if (keuze && !onthuld) hulp = 'Gekozen. Wijzigen kan tot de quizmaster de vraag sluit.';
    if (onthuld) hulp = '17 van de 45 familieleden brak ooit iets.';
    return {
      tegels: tegels, teams: teams, aantalKlaar: '' + aantal,
      hulptekst: hulp, onthuld: onthuld,
      uitslag: juist ? 'Goed! +1 punt, met de joker zelfs +2.' : 'Helaas, het was 17. De ster had gelijk.',
      uitslagBg: juist ? '#A7B43A' : '#B4441A',
      uitslagFg: juist ? '#2B1810' : '#FCEBD0',
      opnieuw: () => {
        this.setState({ keuze: null, petrol: false, onthuld: false });
        this.startDemo();
      }
    };
  }
}
</script>
</body>
</html>
